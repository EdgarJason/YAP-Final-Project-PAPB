<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Base Circle Head -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Left Ear -->
  <polygon points="22,35 15,12 38,21" fill="url(#earGrad)" />
  <polygon points="24,31 19,16 34,22" fill="#F472B6" />

  <!-- Right Ear -->
  <polygon points="78,35 85,12 62,21" fill="url(#earGrad)" />
  <polygon points="76,31 81,16 66,22" fill="#F472B6" />

  <!-- Cheeks -->
  <ellipse cx="28" cy="58" rx="8" ry="5" fill="#F472B6" opacity="0.6" />
  <ellipse cx="72" cy="58" rx="8" ry="5" fill="#F472B6" opacity="0.6" />

  <!-- Eyes (Happy Curved ^ ^) -->
  <path d="M 28,48 Q 35,38 42,48" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
  <path d="M 58,48 Q 65,38 72,48" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />

  <!-- Cute Open Happy Mouth :3 -->
  <path d="M 43,58 Q 47,62 50,58 Q 53,62 57,58" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 46,60 Q 50,66 54,60 Z" fill="#F43F5E" />

  <!-- Symmetric Resting Paws -->
  <rect x="25" y="78" width="22" height="13" rx="6.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6" />
  <rect x="53" y="78" width="22" height="13" rx="6.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6" />
</svg>
